# boeun/250428 — extrinsic 교정본
# 원본 config: lio_ws/SE3-LIO/pipelines/ros1/config/hanwha.yaml (원래 사용하던 값)
# 기존 params.yaml은 extrinsic이 틀렸었음 (z=0.044/yaw 존재). 여기서 z=0.39/단위회전으로 교정.
imu_topic: "/imu/data"
lidar_topic: "/ouster/points"

sensors:
  imu:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001

  lidar:
    min_range: 0.25
    max_range: 100000
    range_cov: 0.001    # 노드가 읽는 키 (hanwha의 ranging_covs[0.001] 의도 반영)
    angle_cov: 0.01

  # [quat : w, x, y, z]
  t_exts: [2.0e-08, 3.0e-07, 0.39]   # 교정: LiDAR가 body 위 0.39m
  q_exts: [1.0, 0.0, 0.0, 0.0]       # 교정: 회전 단위행렬

downsample:
  resolution: 1.0

max_iter: 4

voxel_map:
  resolution: 1.0
  max_layer: 2
  layer_size: [5, 5, 5, 5, 5]
  max_point_size: 1000
  plane_threshold: 0.1

data:
  data_dir: "/ws/data/boeun/250428/fullloop/offline"
  lidar_name: "lidar_Ouster"
  imu_name: "imu_Base"

data_recorder:
  result_dir: "/ws/results/boeun/250428/fullloop"
  test_topic: "cvgl_data_test"
  param_set_name: "default"
  save_frame_mode: 2
